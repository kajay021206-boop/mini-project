<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
      *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }
      body{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .login{
        display: flex;
        width: 80%;
        height: 680px;
        justify-content: space-between;
        padding: 10px;
        border-radius: 20px;
      }
      .login-left{
        width: 50%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 20px;
        margin-top: 30px;
      }
      .login-right{
        width: 50%;
      }
       .login-right img{
        width: 100%;
        height: 100%;
        border-radius: 20px;
        box-shadow: 0 0 12px;
      }
        .logo{
        display: flex;
        flex-direction: column;
       width: 100%;
      margin-top: -60px;
      }
      .logo-one{
        display: flex;
        font-size: 15px;
      }
      .logo-one h1{
        font-weight: bold;
      }
      .logo-one .color{
        color: rgb(92, 43, 226);
      }
      .logo p{
        font-weight:500;
        font-size: 15px;
      }
     .wel{
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 10px;
     }
     .wel h1{
       font-size: 35px;
     }
     .wel p{
      font-size: 15px;
      color: rgb(125, 75, 171);
     }
     .login-input{
      display: flex;
      flex-direction:column;
      gap: 60px;
      margin-top: 38px;
      width: 100%;
     }
     .input{
      position: relative;
       width: 80%; 
     }
     .input input{
      width: 100%;
      display: flex;
      border: none;
      outline: none;
      padding: 10px;
      background: transparent;
      z-index: 10;
      color:#fff;
      position: relative;
     }
     .input h2{
      position: absolute;
      top: -10px;
      font-size: 15px;
      color: rgb(131, 0, 253);
      transition: 0.5s;
     }
     .input i{
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      width: 100%;
      background: black;
      transition: 0.5s;
     }
     .input span{
      position: absolute;
      font-size: 26px;
      display: flex;
      right: 30px;
      margin-top: -30px;
      transform: scale(1);
      transition: .5s;
      color: #8707ff;
     }
     .input input:valid~span,
     .input input:focus~span{
      color:balck;
      transform: scale(0);
     }
     .input input:valid~i,
     .input input:focus~i{
      height: 45px;
      background: #690dc0;
      border-radius: 10px 10px 0 0;
      z-index: 1;
      box-shadow: 0 0 12px #8707ff;
     }
     .input input:valid~h2,
     .input input:focus~h2{
      transform: translateY(-25px);
      font-size: 12px;
      color:black;
     }
     .link{
      display: flex;
     margin-left: -120px;
     width: 80%;
     justify-content: space-between;
     }
     .link-one{
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
     }
     .link-one h5{
      font-size: 16px;
     }
       .link a{
      font-size: 15px;
      color:blue;
      font-weight: bold;
      text-decoration: none;
      position: relative;
     }
     .link a::before{
      content: '';
      position: absolute;
      width: 100%;
      height: 3px;
      bottom: -5px;
      background:blue;
      border-radius: 50px;
      transform: scale(0);
      transition: transform.5s;
      transform-origin: right;
     }
     .link a:hover::before{
      transform: scale(1);
      transform-origin: left;
      box-shadow: 0 0 12px #8707ff;
     }
     .login-button{
      position: relative;
      display: flex;
       margin-left: -120px;
       width: 80%;
     }
     .login-button button{
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      outline: none;
      border: none;
      background:linear-gradient(55deg, rgb(92, 43, 226), rgb(67, 0, 252), rgb(7, 41, 80));
      color: #fff;
      font-size: 18px;
      transition: 0.5s;
     }
     .login-button button:hover{
      transform: scale(1.1);
      background:linear-gradient(55deg, rgb(92, 43, 226), rgb(67, 0, 252), rgb(7, 41, 80), rgb(111, 64, 240), rgb(0, 80, 252));
      box-shadow: 0 0 12px black;
     } 
     .line{
      position: relative;
       margin-left: -120px;
       width: 80%;
       margin-top: 20px;
       text-align: center;
     }
     .line i{
      position: absolute;
      margin-left: -220px;
      width: 90%;
      height: 5px;
      border-radius: 100%;
      background: #2f2f2f;
     }
     .line h5{
      position: absolute;
      margin-top: -7px;
      background:#fff;
      width: 130px;
      margin-left: 180px;
     }
     .with{
      margin-top: 10px;
      position: relative;
      display: flex;
      justify-content: space-between;
      margin-left: -120px;
      gap: 50px;
     }
     .with button{
      padding: 18px 50px;
      border-radius: 5px;
      outline: none;
      border: 1px solid #bbb6b6;
      background: transparent;
      font-weight: bold;
      color: #2c2c2c;
      transition: .5s;
     }
     .with button i{
      font-size: 35px;
      position: absolute;
      margin-top: -10px;
     margin-left: -40px;
     }
     .with button:hover{
      transform: scale(1.1);
      box-shadow: 0 0 8px;
     }
     .color-one i{
      background: linear-gradient(55deg,red,red,yellow,blue ,green);
      -webkit-background-clip: text;
      color: transparent;
     }
     .color-two i{
      color: blue;
     }
     .sign{
      display: flex;
       margin-left: 80px;
       width: 80%;
       gap: 5px;
     }
     .sign h3{
    font-size: 15px;
     }
     .sign a{
      font-size: 15px;
      color:blue;
      font-weight: bold;
      text-decoration: none;
      position: relative;
     }
     .sign a::before{
      content: '';
      position: absolute;
      width: 100%;
      height: 3px;
      bottom: -5px;
      background:blue;
      border-radius: 50px;
      transform: scale(0);
      transition: transform.5s;
      transform-origin: right;
     }
     .sign a:hover::before{
      transform: scale(1);
      transform-origin: left;
      box-shadow: 0 0 12px #8707ff;
     }
     .ba h3{
      position: absolute;
      top: 50px;
      font-size: 15px;
      color: #690dc0;
      cursor: pointer;
     }
    </style>
</head>
<body>
  <div class="ba">
 <a href="landpage.html">
   <h3>Back to page →</h3>
 </a>
  </div>
    <div class="login">
        <div class="login-left">
            
        <div class="wel">
            <h1>Welcome Back!</h1>
            <p>Login to your account and continue your journery towards the perfect job.</p>
        </div>
        <div class="login-input">
          <div class="input">
            <input type="email" required>
                 <span><i class='bx bxs-user-circle'></i></span>
                <h2>Email Address</h2> 
                <i></i>
          </div>    
           <div class="input"> 
                <input type="password" required>
                 <span><i class='bx bxs-lock-open-alt'></i></span>
                <h2>Password</h2>
                <i></i>
          </div>
        </div>
        <div class="link">
            <div class="link-one">
              <input type="checkbox">
               <h5>Remember me</h5>
            </div>
            <a href="#">Forgot Password?</a>
        </div>
           <div class="login-button">
            <button>Login</button>
          </div>
            <div class="line">
                <i></i>
                <h5>or continue with</h5>
            </div>
            <div class="with">
                <button class="color-one"><i class='bx bxl-google'></i>  Continue with Google</button>
                 <button class="color-two"><i class='bx bxl-linkedin-square'></i>  Continue with Linkedin</button>
            </div>
            <div class="sign">
                <h3>Don't have an account?</h3>
                <a href="account.html">Sign Up</a>
            </div>
        </div>
        <div class="login-right">
            <img src="mini.png">
        </div>
    </div>

    <script>
   
    </script>
</body>
</html>
